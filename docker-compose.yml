services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  api:
    image: ${API_IMAGE:-hydroguard:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-local}
        APP_SOURCE: ${APP_SOURCE:-}
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=HydroGuardDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      Jwt__Key: ${JWT_KEY:?Defina JWT_KEY}
      Jwt__Issuer: HydroGuard
      Jwt__Audience: HydroGuardUsers
      Bootstrap__AdminPassword: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD}
      Bootstrap__SeedDemoData: ${SEED_DEMO_DATA:-false}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-5000}:8080"
    networks:
      - frontend
      - database
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
volumes:
  sqlserver_data:
networks:
  frontend:
    driver: bridge
  database:
    driver: bridge
    internal: true
